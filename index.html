.g{grid-template-columns:repeat(2,1fr);gap:12px}

@media(min-width:1000px){.g{grid-template-columns:repeat(4,1fr)}}
html[data-tema] .c{border-radius:16px;padding:12px;margin-bottom:12px;border:1px solid var(--bd);}
.tile{min-height:92px;border-radius:16px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile span{font-size:30px}

.c.tile:active{transform:scale(.96)}
.k{font-size:12px}.gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:16px 2px 8px}

.b:hover{filter:brightness(1.08)}.b:active{transform:translateY(2px) scale(.98);box-shadow:none!important}
html[data-tema] nav{border-radius:16px 16px 0 0;border-top:1px solid var(--bd);box-shadow:0 -2px 12px var(--sh)}
nav button{position:relative;min-height:56px;font-weight:600;}
html[data-tema] nav button.on{color:var(--ac);border-top-color:transparent}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
nav button.on span{transform:translateY(-1px) scale(1.12)}
main>*{}

html[data-tema] #modal{backdrop-filter:blur(2px)}

.bn svg{width:110px;flex:0 0 auto;border-radius:10px}
.bn .bt{min-width:0;flex:1}.bn .bt>b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
